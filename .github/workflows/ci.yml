# Runs the whole test suite on every push and pull request.
# (release.yml is separate: it only runs on version tags.)
name: ci
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  NODE_VERSION: '24.22.1'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}' }
      - name: Install every package from its lock file
        run: npm run install:all
      - name: The two copies of the Librarian core must match
        run: |
          bash server/scripts/sync-server-librarian.sh
          git diff --exit-code -- server/server.src/app/src/librarian
      - name: server/dist/librarian.mjs must be a fresh build of the source
        run: |
          npm run build --prefix server
          git diff --exit-code -- server/dist
      - name: Tests (check, spoke, hub, server, door, guard)
        run: npm test
