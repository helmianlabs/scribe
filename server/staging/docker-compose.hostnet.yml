# Override for machines where Docker bridge networking between containers is unavailable
# (e.g. nested sandboxes). Everything runs on the host network on non-default ports.
#   docker compose -f staging/docker-compose.yml -f staging/docker-compose.hostnet.yml up -d --build
services:
  db:
    network_mode: host
    command: ["postgres", "-p", "55432", "-c", "listen_addresses=127.0.0.1"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 55432 -U owner -d memory"]
  hooks:
    network_mode: host
    command: ["node", "-e", "require('http').createServer((q,s)=>{let b='';q.on('data',c=>b+=c);q.on('end',()=>{require('fs').appendFileSync('/data/hooks.jsonl',JSON.stringify({path:q.url,sig:q.headers['x-memory-signature']||null,body:b})+'\\n');s.end('ok')})}).listen(9000,'127.0.0.1')"]
  app:
    network_mode: host
    ports: !reset []
    environment:
      PORT: "8787"
      DATABASE_URL: postgres://memory_app:staging-only-app-password@127.0.0.1:55432/memory
